# Tự động dựng APK release và phát hành lên GitHub Release.
#
# Có ba cách chạy:
#   - Đẩy commit vào main: phiên bản được tự tính từ các commit kể từ tag gần nhất,
#     tag mới được tạo ngay lúc phát hành.
#   - Đẩy một tag dạng v1.2.3: dùng đúng phiên bản trong tag, không tự tính.
#   - Bấm chạy tay (workflow_dispatch): chỉ thử quy trình, ra artifact chứ không
#     tạo tag hay Release, nên không làm rác danh sách phiên bản.
#
# Muốn đẩy một commit vào main mà không phát hành thì ghi [skip release] trong
# thông điệp commit.
name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Cần quyền ghi để tạo tag, tạo GitHub Release và đính file APK vào đó.
permissions:
  contents: write

# Hai commit đẩy liên tiếp không được chạy song song, vì cả hai sẽ cùng đọc tag gần
# nhất và tính ra cùng một số phiên bản.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      # fetch-depth 0 để lấy toàn bộ tag và lịch sử commit, phục vụ việc tự tăng phiên bản.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Test JVM chạy trước khi build: phát hành một bản có luật cờ sai thì tốn hơn
      # nhiều so với chờ thêm mấy phút ở đây. Không cần emulator nên rất nhanh.
      - name: Run the JVM tests
        run: ./gradlew :engine:test :ai:test :net:test

      # Quy tắc tự tăng phiên bản, đọc các commit kể từ tag v* gần nhất:
      #   - có commit kiểu "feat!:" hoặc "BREAKING CHANGE" -> tăng số major
      #   - có commit kiểu "feat:" / "feat(scope):"          -> tăng số minor
      #   - còn lại (fix, chore, docs...)                    -> tăng số patch
      # versionCode luôn lấy số lần chạy workflow vì nó tăng đơn điệu, không bao giờ lặp.
      - name: Resolve the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            TAG_NAME="$GITHUB_REF_NAME"
          else
            LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [ -z "$LAST_TAG" ]; then
              BASE="0.0.0"
              LOG=$(git log --pretty=%B)
            else
              BASE="${LAST_TAG#v}"
              LOG=$(git log --pretty=%B "$LAST_TAG..HEAD")
            fi

            BUMP=patch
            if printf '%s\n' "$LOG" | grep -qE '^(BREAKING CHANGE|[a-z]+(\(.+\))?!:)'; then
              BUMP=major
            elif printf '%s\n' "$LOG" | grep -qE '^feat(\(.+\))?:'; then
              BUMP=minor
            fi

            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac

            VERSION_NAME="$MAJOR.$MINOR.$PATCH"
            TAG_NAME="v$VERSION_NAME"
            echo "Last tag ${LAST_TAG:-none}, bump $BUMP, next $TAG_NAME"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      # Keystore được giữ dưới dạng base64 trong secret rồi giải ra file tạm của runner.
      # Báo lỗi rõ khi thiếu secret, vì nếu để chạy tiếp thì Gradle sẽ âm thầm ra một APK
      # chưa ký và bản phát hành đó không ai cài được.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Đổi tên file theo phiên bản để tải về nhiều bản không bị trùng tên app-release.apk.
      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/chess-$VERSION_NAME.apk"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: dist/*.apk

      # Bước này tự tạo tag tại commit đang build khi tag chưa tồn tại, nên không cần
      # đẩy tag bằng tay ở bước riêng. Chạy sau khi build xong để một lần build lỗi
      # không đốt mất một số phiên bản.
      - name: Publish the GitHub release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
