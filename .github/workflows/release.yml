# Tự động dựng APK release khi đẩy một tag dạng v1.2.3 lên GitHub.
#
# Chạy tay được bằng workflow_dispatch để thử toàn bộ quy trình mà không phải tạo tag
# rác; lúc đó chỉ ra artifact chứ không tạo Release.
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Cần quyền ghi để tạo GitHub Release và đính file APK vào đó.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # Test JVM chạy trước khi build: phát hành một bản có luật cờ sai thì tốn hơn
      # nhiều so với chờ thêm mấy phút ở đây. Không cần emulator nên rất nhanh.
      - name: Run the JVM tests
        run: ./gradlew :engine:test :ai:test :net:test

      # versionName lấy từ tag (bỏ chữ v đứng đầu), versionCode lấy số lần chạy workflow
      # vì nó luôn tăng. Chạy tay thì không có tag nên đặt tên tạm theo commit.
      - name: Resolve the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # Keystore được giữ dưới dạng base64 trong secret rồi giải ra file tạm của runner.
      # Báo lỗi rõ khi thiếu secret, vì nếu để chạy tiếp thì Gradle sẽ âm thầm ra một APK
      # chưa ký và bản phát hành đó không ai cài được.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Đổi tên file theo phiên bản để tải về nhiều bản không bị trùng tên app-release.apk.
      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/chess-$VERSION_NAME.apk"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: dist/*.apk

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
